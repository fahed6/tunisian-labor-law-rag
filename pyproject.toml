[project]
name = "agent-rag-actualites"
version = "1.0.0"
description = "Projet de référence : agent RAG d'actualité avec outils, construit selon CRISP-DM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "feedparser>=6.0",              # étape 2 : lecture des flux RSS
    "pandas>=2.0",                  # étape 2 : exploration
    "numpy>=1.26",                  # étape 4 : index vectoriel + similarité
    "sentence-transformers>=3.0",   # étape 4 : modèle d'embedding local
    "ollama>=0.6.3",                # étapes 4-6 : LLM local open source
    "fastapi>=0.115",               # étape 6 : API REST
    "uvicorn>=0.30",                # étape 6 : serveur de l'API
    "streamlit>=1.40",              # étape 6 : interface web
    "pymupdf>=1.28.2",
]

[project.scripts]
agent-rag = "agent_rag.cli:main"    # après installation : « agent-rag pipeline »

[dependency-groups]
dev = [
    "pytest>=8.0",                  # tests automatisés
    "jupyter>=1.1.1",               # notebook de démonstration
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
